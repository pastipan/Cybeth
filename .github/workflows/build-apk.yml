# Compila el APK y lo publica en "Releases" con un enlace directo para descargarlo desde el celular.
name: Compilar APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew testDebugUnitTest assembleRelease --no-daemon
      - run: cp app/build/outputs/apk/release/app-release.apk CybethSG.apk
      - uses: actions/upload-artifact@v4
        with:
          name: CybethSG-apk
          path: CybethSG.apk
      - name: Publicar descarga
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ultima
          name: Cybeth SG (última versión)
          body: "Abre este enlace desde el celular y toca CybethSG.apk para instalar."
          files: CybethSG.apk
          make_latest: true
